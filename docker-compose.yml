services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mai-uiux-frontend:latest
    container_name: mai-uiux-frontend-1
    restart: unless-stopped
    ports:
      # Giữ port 3456 để nginx test.maioi.com (proxy_pass 127.0.0.1:3456) không phải sửa
      - "3456:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
